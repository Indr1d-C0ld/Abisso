# ABISSO — studio del danno da carica di profondità sugli U-Boot.
# Sito statico (Vite) in /var/www/html/abisso, servito sotto /abisso/.
# Installazione: conf-available/abisso.conf + a2enconf (vedi installa-balthasar.sh).
# Su Balthasar AllowOverride e' None: le regole stanno qui.

<Directory /var/www/html/abisso>
    Options -Indexes
    Require all granted
    AddType model/gltf-binary .glb
    <IfModule mod_headers.c>
        # La pagina e la versione si ricontrollano sempre; gli asset hanno l'impronta nel nome.
        <FilesMatch "^(index\.html|version\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</Directory>

<Directory /var/www/html/abisso/assets>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

# Modelli 3D e immagini d'archivio: nomi stabili, una settimana di cache.
<DirectoryMatch "^/var/www/html/abisso/(models|archive)">
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=604800"
    </IfModule>
</DirectoryMatch>

# /abisso (senza barra) → /abisso/
RedirectMatch 301 ^/abisso$ /abisso/
